<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portail interne</title>

<style>
body { font-family: system-ui, Arial; margin:0; background:#0b0b10; color:#fff; }
.wrap { max-width:900px; margin:auto; padding:30px 16px 60px; }
.card { background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12); border-radius:18px; padding:20px; margin-bottom:20px; }
h1 { font-size:20px; margin:0 0 10px; }
p { line-height:1.6; margin:8px 0; }
.muted { opacity:0.75; font-size:13px; }

.grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:15px; }
.tile { aspect-ratio:1/1; overflow:hidden; border-radius:12px; cursor:pointer; border:2px solid rgba(255,255,255,0.12); background:rgba(255,255,255,0.04); }
.tile img { width:100%; height:100%; object-fit:cover; display:block; }
.tile.selected { border-color:#ff4d88; box-shadow:0 0 0 3px rgba(255,77,136,0.2) inset; }

button { margin-top:15px; padding:12px 14px; border:0; border-radius:12px; font-weight:700; cursor:pointer; background:#ff4d88; color:#111; }
.ghost { background:rgba(255,255,255,0.10); color:#fff; border:1px solid rgba(255,255,255,0.14); }
.hidden { display:none; }

input {
  padding:12px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,0.18);
  width:100%;
  margin-top:10px;
  background:rgba(0,0,0,0.25);
  color:#fff;
  box-sizing:border-box;
  font-size:16px;
}
</style>
</head>

<body>
<div class="wrap">

<section id="portalSection" class="card">
  <h1>Mesures préventives - Mise à jour</h1>
  <p>Accès réservé à la consultation des notes internes liées aux mesures préventives temporaires.</p>
  <button id="startBtn">Continuer</button>
</section>

<section id="captchaSection" class="card hidden">
  <h1 id="instruction"></h1>
  <p id="roundIndicator" class="muted"></p>
  <div id="grid" class="grid"></div>
  <button id="validateBtn">Valider</button>
  <button id="resetBtn" class="ghost">Réinitialiser</button>
  <p id="feedback" class="muted"></p>
</section>

<section id="textSection" class="card hidden">
  <h1>Vérification sémantique finale</h1>
  <p>
    chaton chaton<br>
    j’aime le chaton<br>
    tu es le chaton<br>
    donc je ______
  </p>
  <input type="text" id="loveInput" placeholder="Complétez la phrase">
  <button id="textValidateBtn">Valider</button>
  <p id="textFeedback" class="muted"></p>
</section>

<section id="revealSection" class="card hidden">
  <h1>Joyeux anniversaire Tea ❤️</h1>
  <p class="muted">Validation complète. Accès accordé.</p>

  <div class="grid">
    <div class="tile"><img src="reveal1.jpeg"></div>
    <div class="tile"><img src="reveal2.jpeg"></div>
    <div class="tile"><img src="reveal3.jpeg"></div>
    <div class="tile"><img src="reveal4.jpeg"></div>
  </div>

  <button id="confettiBtn">Lancer des confettis</button>
</section>

</div>

<script>

const rounds = [

{
instruction:"Veuillez sélectionner toutes les cacahuètes présentes sur ces images.",
images:[
{src:"r1_1.jpeg",correct:true},
{src:"r1_2.jpeg",correct:false},
{src:"r1_3.jpeg",correct:false},
{src:"r1_4.jpeg",correct:true},
{src:"r1_5.jpeg",correct:true},
{src:"r1_6.jpeg",correct:false},
{src:"r1_7.jpeg",correct:false},
{src:"r1_8.jpeg",correct:true},
{src:"r1_9.jpeg",correct:false}
]
},

{
instruction:"Veuillez sélectionner toutes les images présentant un fort indice de mignonnerie animale.",
images:[
{src:"r2_1.jpeg",correct:true},
{src:"r2_2.jpeg",correct:true},
{src:"r2_3.jpeg",correct:false},
{src:"r2_4.jpeg",correct:true},
{src:"r2_5.jpeg",correct:false},
{src:"r2_6.jpeg",correct:false},
{src:"r2_7.jpeg",correct:false},
{src:"r2_8.jpeg",correct:true},
{src:"r2_9.jpeg",correct:true}
]
},

{
instruction:"Veuillez sélectionner toutes les preuves d’amour inconditionnel… envers la nourriture.",
images:[
{src:"r3_1.jpeg",correct:true},
{src:"r3_2.jpeg",correct:true},
{src:"r3_3.jpeg",correct:true},
{src:"r3_4.jpeg",correct:true},
{src:"r3_5.jpeg",correct:false},
{src:"r3_6.jpeg",correct:true},
{src:"r3_7.jpeg",correct:true},
{src:"r3_8.jpeg",correct:true},
{src:"r3_9.jpeg",correct:true}
]
},

{
instruction:"Veuillez sélectionner toutes les images présentant une valeur esthétique exceptionnelle.",
images:[
{src:"r4_1.jpeg",correct:true},
{src:"r4_2.jpeg",correct:true},
{src:"r4_3.jpeg",correct:true},
{src:"r4_4.jpeg",correct:true},
{src:"r4_5.jpeg",correct:true},
{src:"r4_6.jpeg",correct:true},
{src:"r4_7.jpeg",correct:true},
{src:"r4_8.jpeg",correct:true},
{src:"r4_9.jpeg",correct:true}
]
}

];

let currentRound=0;
let selected=new Set();

const portalSection=document.getElementById("portalSection");
const captchaSection=document.getElementById("captchaSection");
const textSection=document.getElementById("textSection");
const revealSection=document.getElementById("revealSection");

const instructionEl=document.getElementById("instruction");
const roundIndicator=document.getElementById("roundIndicator");
const gridEl=document.getElementById("grid");
const feedbackEl=document.getElementById("feedback");

document.getElementById("startBtn").onclick=()=>{
portalSection.classList.add("hidden");
captchaSection.classList.remove("hidden");
loadRound();
};

function loadRound(){
selected.clear();
feedbackEl.textContent="";
instructionEl.textContent=rounds[currentRound].instruction;
roundIndicator.textContent="Round "+(currentRound+1)+"/4";
gridEl.innerHTML="";

rounds[currentRound].images.forEach((img,index)=>{
const tile=document.createElement("div");
tile.className="tile";

const image=document.createElement("img");
image.src=img.src;
tile.appendChild(image);

tile.onclick=()=>{
if(selected.has(index)){
selected.delete(index);
tile.classList.remove("selected");
}else{
selected.add(index);
tile.classList.add("selected");
}
};

gridEl.appendChild(tile);
});
}

document.getElementById("validateBtn").onclick=()=>{
const imgs=rounds[currentRound].images;
for(let i=0;i<imgs.length;i++){
if(imgs[i].correct!==selected.has(i)){
feedbackEl.textContent="Sélection incorrecte. Merci de réessayer.";
return;
}
}

currentRound++;

if(currentRound<rounds.length){
loadRound();
}else{
captchaSection.classList.add("hidden");
textSection.classList.remove("hidden");
}
};

document.getElementById("resetBtn").onclick=()=>loadRound();

function normalize(s){
return (s||"").toLowerCase().trim().replaceAll("’","'").replace(/\s+/g," ");
}

document.getElementById("textValidateBtn").onclick=()=>{
const value=normalize(document.getElementById("loveInput").value);
if(value.includes("t'aime")||value.includes("t aime")){
textSection.classList.add("hidden");
revealSection.classList.remove("hidden");
}else{
document.getElementById("textFeedback").textContent="Réponse presque correcte… réessayez.";
}
};

document.getElementById("confettiBtn").onclick=()=>{
for(let i=0;i<140;i++){
const s=document.createElement("div");
s.style.position="fixed";
s.style.left=Math.random()*100+"vw";
s.style.top="-10px";
s.style.width="8px";
s.style.height="12px";
s.style.background=`hsl(${Math.random()*360},90%,60%)`;
s.style.zIndex=9999;
document.body.appendChild(s);
const fall=s.animate([{top:"-10px"},{top:"105vh"}],
{duration:1600+Math.random()*1200});
fall.onfinish=()=>s.remove();
}
};

</script>
</body>
</html>
