<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Portail sécurisé</title>

<style>
body { font-family: system-ui, Arial; margin:0; background:#0b0b10; color:white; }
.wrap { max-width:900px; margin:auto; padding:30px 16px 60px; }
.card { background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12); border-radius:18px; padding:20px; margin-bottom:20px; }
h1 { font-size:20px; margin:0 0 10px; }
p { line-height:1.6; }
.grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:15px; }
.tile { aspect-ratio:1/1; overflow:hidden; border-radius:12px; cursor:pointer; border:2px solid rgba(255,255,255,0.12); }
.tile img { width:100%; height:100%; object-fit:cover; }
.tile.selected { border-color:#ff4d88; box-shadow:0 0 0 3px rgba(255,77,136,0.2) inset; }
button { margin-top:15px; padding:12px 14px; border:0; border-radius:12px; font-weight:700; cursor:pointer; background:#ff4d88; color:#111; }
.hidden { display:none; }
input { padding:10px; border-radius:8px; border:1px solid rgba(255,255,255,0.3); width:100%; margin-top:10px; background:rgba(0,0,0,0.3); color:white; }
</style>
</head>

<body>
<div class="wrap">

<!-- CAPTCHA -->
<section id="captchaSection" class="card">
  <h1 id="instruction"></h1>
  <div id="grid" class="grid"></div>
  <button id="validateBtn">Valider</button>
  <p id="feedback"></p>
</section>

<!-- TEXTE A TROU -->
<section id="textSection" class="card hidden">
  <h1>Vérification sémantique finale</h1>
  <p>
  chaton chaton<br>
  j’aime le chaton<br>
  tu es le chaton<br>
  donc je ______
  </p>
  <input type="text" id="loveInput" placeholder="Complétez la phrase">
  <button id="textValidateBtn">Valider</button>
  <p id="textFeedback"></p>
</section>

<!-- REVEAL -->
<section id="revealSection" class="card hidden">
  <h1>Joyeux anniversaire Tea ❤️</h1>
  <p>Validation complète. Présence confirmée.</p>
  <p>Mets ici ton message personnel.</p>
</section>

</div>

<script>

const rounds = [
  {
    instruction: "Veuillez sélectionner toutes les cacahuètes présentes sur ces images.",
    images: [
      {src:"r1_1.jpg", correct:true},
      {src:"r1_2.jpg", correct:false},
      {src:"r1_3.jpg", correct:true},
      {src:"r1_4.jpg", correct:false},
      {src:"r1_5.jpg", correct:true},
      {src:"r1_6.jpg", correct:false},
      {src:"r1_7.jpg", correct:false},
      {src:"r1_8.jpg", correct:true},
      {src:"r1_9.jpg", correct:false},
    ]
  },
  {
    instruction: "Veuillez sélectionner toutes les images présentant un fort indice de mignonnerie animale.",
    images: [
      {src:"r2_1.jpg", correct:true},
      {src:"r2_2.jpg", correct:false},
      {src:"r2_3.jpg", correct:true},
      {src:"r2_4.jpg", correct:false},
      {src:"r2_5.jpg", correct:true},
      {src:"r2_6.jpg", correct:false},
      {src:"r2_7.jpg", correct:false},
      {src:"r2_8.jpg", correct:true},
      {src:"r2_9.jpg", correct:false},
    ]
  },
  {
    instruction: "Veuillez sélectionner toutes les preuves d’amour inconditionnel… envers la nourriture.",
    images: [
      {src:"r3_1.jpg", correct:true},
      {src:"r3_2.jpg", correct:false},
      {src:"r3_3.jpg", correct:true},
      {src:"r3_4.jpg", correct:false},
      {src:"r3_5.jpg", correct:true},
      {src:"r3_6.jpg", correct:false},
      {src:"r3_7.jpg", correct:false},
      {src:"r3_8.jpg", correct:true},
      {src:"r3_9.jpg", correct:false},
    ]
  },
  {
    instruction: "Veuillez sélectionner toutes les images présentant une valeur esthétique exceptionnelle.",
    images: [
      {src:"r4_1.jpg", correct:true},
      {src:"r4_2.jpg", correct:false},
      {src:"r4_3.jpg", correct:true},
      {src:"r4_4.jpg", correct:false},
      {src:"r4_5.jpg", correct:true},
      {src:"r4_6.jpg", correct:false},
      {src:"r4_7.jpg", correct:false},
      {src:"r4_8.jpg", correct:true},
      {src:"r4_9.jpg", correct:false},
    ]
  }
];

let currentRound = 0;
let selected = new Set();

const instructionEl = document.getElementById("instruction");
const gridEl = document.getElementById("grid");
const feedbackEl = document.getElementById("feedback");

function loadRound() {
  selected.clear();
  feedbackEl.textContent = "";
  instructionEl.textContent = rounds[currentRound].instruction;
  gridEl.innerHTML = "";

  rounds[currentRound].images.forEach((img, index) => {
    const tile = document.createElement("div");
    tile.className = "tile";

    const image = document.createElement("img");
    image.src = img.src;
    tile.appendChild(image);

    tile.onclick = () => {
      if (selected.has(index)) {
        selected.delete(index);
        tile.classList.remove("selected");
      } else {
        selected.add(index);
        tile.classList.add("selected");
      }
    };

    gridEl.appendChild(tile);
  });
}

document.getElementById("validateBtn").onclick = () => {
  const correctIndexes = rounds[currentRound].images
    .map((img,i)=> img.correct ? i : null)
    .filter(i=> i!==null);

  const isCorrect = correctIndexes.length === selected.size &&
    correctIndexes.every(i => selected.has(i));

  if (!isCorrect) {
    feedbackEl.textContent = "Sélection incorrecte. Merci de réessayer.";
    return;
  }

  currentRound++;

  if (currentRound < rounds.length) {
    loadRound();
  } else {
    document.getElementById("captchaSection").classList.add("hidden");
    document.getElementById("textSection").classList.remove("hidden");
  }
};

document.getElementById("textValidateBtn").onclick = () => {
  const value = document.getElementById("loveInput").value.toLowerCase().trim();

  if (value.includes("t'aime") || value.includes("t aime")) {
    document.getElementById("textSection").classList.add("hidden");
    document.getElementById("revealSection").classList.remove("hidden");
  } else {
    document.getElementById("textFeedback").textContent = "Réponse presque correcte… réessayez.";
  }
};

loadRound();

</script>
</body>
</html>
